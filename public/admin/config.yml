# local_backend: true so tem efeito quando roda `npx decap-server` em paralelo (uso local/teste).
# Em producao esse valor e ignorado e o backend "github" abaixo (com OAuth, Task 12) e usado.
local_backend: true

backend:
  name: github
  repo: alfamarcenariaita-afk/alfa-marcenaria-site
  branch: main
  # Precisa ser exatamente o mesmo dominio de `siteConfig.url` em lib/metadata.js (YAML nao
  # consegue referenciar o valor JS) — se o dominio final mudar, atualizar aqui tambem, senao
  # o painel chama /api/auth no dominio antigo e o login do CMS quebra sem erro claro.
  # IMPORTANTE: base_url tem que ser SO a origem (sem /api no final): o Decap compara
  # `event.origin === base_url` no handshake do popup de login, e a origem nunca tem caminho.
  # Com "/api" aqui o popup do GitHub volta pra /api/callback e fica em branco pra sempre.
  base_url: https://alfamarcenaria.com.br
  auth_endpoint: api/auth

media_folder: public/images/uploads
public_folder: /images/uploads

# Painel em portugues
locale: "pt"

# Sem isso, slugs de titulos acentuados (ex.: "Corrimão") viram nomes de arquivo
# com acento (corrimão.md) em vez de puro ASCII (corrimao.md) — inconsistente
# com os slugs existentes em content/ (todos ASCII, ex.: marco-de-porta.md).
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: paginas
    label: Páginas
    files:
      - name: home
        label: Home
        file: content/paginas/home.md
        fields:
          - { label: Título, name: titulo, widget: string }
          - { label: Subtítulo, name: subtitulo, widget: string }
          - { label: "Texto do botão", name: chamada, widget: string }
          - { label: "WhatsApp (só números, com DDI+DDD)", name: whatsapp, widget: string }
          - { label: "Texto de introdução", name: body, widget: markdown }
      - name: sobre
        label: Sobre
        file: content/paginas/sobre.md
        fields:
          - { label: Título, name: titulo, widget: string }
          - { label: Foto da equipe, name: imagem, widget: image, required: false }
          - { label: Texto, name: body, widget: markdown }
      - name: contato
        label: Contato
        file: content/paginas/contato.md
        fields:
          - { label: Título, name: titulo, widget: string }
          - { label: Telefone, name: telefone, widget: string }
          - { label: "WhatsApp (só números)", name: whatsapp, widget: string }
          - { label: Endereço, name: endereco, widget: string }
          - { label: "Instagram (@usuario)", name: instagram, widget: string }
          - { label: "Horário de atendimento", name: horario, widget: string }
          - { label: "Texto extra", name: body, widget: markdown, required: false }

  - name: config
    label: "Configurações do site (cores, banner, logo)"
    files:
      - name: config
        label: "Aparência e textos fixos"
        file: content/paginas/config.md
        fields:
          - { label: "Nome do site (cabeçalho e rodapé)", name: nomeSite, widget: string }
          - { label: "Logo (imagem do cabeçalho)", name: logo, widget: image, required: false }
          - { label: "Cor escura (textos, rodapé, botões)", name: corEscura, widget: color }
          - { label: "Cor de destaque (dourado: links, detalhes)", name: corDestaque, widget: color }
          - { label: "Cor do fundo das páginas", name: corFundo, widget: color }
          - { label: "Banner da Home (foto de fundo)", name: bannerImagem, widget: image, required: false }
          - label: "Escurecimento do banner (0 = foto pura, 90 = bem escuro)"
            name: bannerEscurecer
            widget: number
            value_type: int
            min: 0
            max: 90
            default: 70
          - label: "Selos da Home (3 destaques abaixo do banner)"
            name: selos
            widget: list
            fields:
              - { label: Título, name: titulo, widget: string }
              - { label: Texto, name: texto, widget: string }
          - { label: "Título dos serviços na Home", name: tituloServicosHome, widget: string }
          - { label: "Link 'ver todos' na Home", name: textoLinkServicos, widget: string }
          - { label: "Título da página Serviços", name: tituloServicos, widget: string }
          - { label: "Texto do botão na página Contato", name: textoBotaoContato, widget: string }
          - { label: "Frase abaixo do botão (Contato)", name: textoOrcamento, widget: string }

  - name: servicos
    label: Serviços
    folder: content/servicos
    create: true
    slug: "{{slug}}"
    identifier_field: nome
    fields:
      - { label: Nome, name: nome, widget: string }
      - label: Categoria
        name: categoria
        widget: select
        options: [Portas, Marcos, Janelas, Painéis, Alizares, Corrimãos, Personalizado, Outros]
        default: Outros
      - { label: Foto, name: imagem, widget: image, required: false }
      - { label: Descrição, name: body, widget: markdown }

  - name: portfolio
    label: Portfólio
    folder: content/portfolio
    create: true
    slug: "{{slug}}"
    identifier_field: titulo
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Foto, name: imagem, widget: image, required: false }
      - { label: Categoria, name: categoria, widget: string, required: false }
      - { label: Legenda, name: body, widget: markdown, required: false }

  - name: blog
    label: Blog
    folder: content/blog
    create: true
    slug: "{{slug}}"
    identifier_field: titulo
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Data, name: data, widget: datetime }
      - { label: "Imagem de capa", name: imagemCapa, widget: image, required: false }
      - { label: "Resumo (aparece no Google)", name: resumo, widget: text }
      - { label: Conteúdo, name: body, widget: markdown }
